name: Update Credly Badges

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pemtajo/credly-badges@main
        with:
          CREDLY_USER: lochana-manuth-bandara
          NUMBER_OF_BADGES: 10
          BADGE_SIZE: 100
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Credly badges"
          git push
